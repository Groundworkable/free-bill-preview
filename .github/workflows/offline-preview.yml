name: Groundwork offline website preview
on:
  pull_request:
    paths:
      - "**/*.html"
      - "media/**"
      - "assets/**"
      - ".github/workflows/offline-preview.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package approved public pages and Bloom media
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          root=Path('groundwork-local-preview')
          root.mkdir(exist_ok=True)
          pages=['index.html','tour.html','free-tools.html','organizations.html',
                 'about.html','faqs.html','contact.html','careers.html','legal.html',
                 'privacy.html','beta-terms.html']
          for name in pages:
              shutil.copy2(name,root/name)
          for folder in ['media','assets']:
              shutil.copytree(folder,root/folder,dirs_exist_ok=True)
          for name in ['favicon.ico','apple-touch-icon.png','robots.txt','sitemap.xml']:
              if Path(name).exists():
                  shutil.copy2(name,root/name)
          (root/'START_HERE.txt').write_text(
              'GROUNDWORK WEBSITE REVIEW COPY — NOT LIVE\n\n'
              'Start with index.html, or run a local static server if your browser blocks file:// pages.\n'
              'Explore the approved entrance, Bloom, tour, free tools, organizations, company and legal pages.\n'
              'No customer registration, checkout, or subscription activation is connected.\n'
              'Email drafts need to be reviewed and sent by the visitor.\n'
              'This is a preview, not proof that the live website has passed launch checks.\n',
              encoding='utf-8')
          assert (root/'media/bloom-orbit.mp4').stat().st_size > 1_000_000
          assert (root/'media/bloom-poster.jpg').exists()
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: groundwork-website-review-copy
          path: groundwork-local-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Build one-file approved entrance visual preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          root=Path.cwd()
          text=(root/'index.html').read_text(encoding='utf-8')
          video=base64.b64encode((root/'media/bloom-orbit.mp4').read_bytes()).decode('ascii')
          poster=base64.b64encode((root/'media/bloom-poster.jpg').read_bytes()).decode('ascii')
          text=text.replace('./media/bloom-orbit.mp4','data:video/mp4;base64,'+video)
          text=text.replace('./media/bloom-poster.jpg','data:image/jpeg;base64,'+poster)
          text=text.replace('<title>','<title>[OFFLINE PREVIEW] ',1)
          notice='<div style="position:fixed;z-index:99999;top:0;left:0;right:0;background:#d9b45b;color:#06362b;padding:7px;text-align:center;font:700 12px Arial,sans-serif">OFFLINE PREVIEW — NOT THE LIVE SITE</div>'
          text=text.replace('<body>', '<body>'+notice,1)
          out=root/'groundwork-one-file-preview'
          out.mkdir(exist_ok=True)
          (out/'GROUNDWORK-ENTRANCE-PREVIEW.html').write_text(text,encoding='utf-8')
          (out/'README.txt').write_text(
              'Open the HTML locally to review the approved entrance and Bloom. Other pages require the complete review copy. This does not activate customer accounts, billing or a live deployment.\n',
              encoding='utf-8')
          assert 'data:video/mp4;base64,' in text and 'data:image/jpeg;base64,' in text
          assert '<style>' in text
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: groundwork-ONE-FILE-preview
          path: groundwork-one-file-preview/
          if-no-files-found: error
          retention-days: 14
