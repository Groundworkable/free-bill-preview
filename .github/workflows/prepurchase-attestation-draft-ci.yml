name: Groundwork isolated TEST purchaser attestation (draft-only)

on:
  push:
    branches:
      - site/prepurchase-checkout-gate-2026-11-13
    paths:
      - 'preorder/payment-service/purchase_attestation_producer.draft.mjs'
      - 'preorder/payment-service/purchase_attestation_producer.draft.test.mjs'
      - 'preorder/payment-service/purchase_attestation_transport.draft.mjs'
      - 'preorder/payment-service/purchase_attestation_transport.draft.test.mjs'
      - 'preorder/payment-service/purchase_attestation_transport.integration.test.mjs'
      - 'preorder/payment-service/remote_d1_attestation_request_nonce_DRAFT_DO_NOT_APPLY.sql'
      - 'preorder/payment-service/attestation_request_nonce_ledger.test.py'
      - 'preorder/payment-service/private_attestation_entry.DRAFT_DO_NOT_DEPLOY.mjs'
      - 'preorder/payment-service/private_attestation_entry.test.mjs'
      - 'preorder/payment-service/worker.mjs'
      - '.github/workflows/prepurchase-attestation-draft-ci.yml'
  pull_request:
    paths:
      - 'preorder/payment-service/purchase_attestation_producer.draft.mjs'
      - 'preorder/payment-service/purchase_attestation_producer.draft.test.mjs'
      - 'preorder/payment-service/purchase_attestation_transport.draft.mjs'
      - 'preorder/payment-service/purchase_attestation_transport.draft.test.mjs'
      - 'preorder/payment-service/purchase_attestation_transport.integration.test.mjs'
      - 'preorder/payment-service/remote_d1_attestation_request_nonce_DRAFT_DO_NOT_APPLY.sql'
      - 'preorder/payment-service/attestation_request_nonce_ledger.test.py'
      - 'preorder/payment-service/private_attestation_entry.DRAFT_DO_NOT_DEPLOY.mjs'
      - 'preorder/payment-service/private_attestation_entry.test.mjs'
      - 'preorder/payment-service/worker.mjs'
      - '.github/workflows/prepurchase-attestation-draft-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-attestation:
    name: Synthetic signed TEST purchase / buyer proof guards (no deployment)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check isolated D1 replay nonce constraints without deployment
        run: python3 preorder/payment-service/attestation_request_nonce_ledger.test.py
      - name: Confirm draft-only receiver-disabled TEST purchase attestation
        run: node --test preorder/payment-service/purchase_attestation_producer.draft.test.mjs preorder/payment-service/purchase_attestation_transport.draft.test.mjs preorder/payment-service/purchase_attestation_transport.integration.test.mjs preorder/payment-service/private_attestation_entry.test.mjs
