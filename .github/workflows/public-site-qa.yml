name: Groundwork public site QA
on:
  pull_request:
    paths:
      - "**/*.html"
      - "assets/css/**"
      - "assets/images/**"
      - "assets/js/**"
      - "sitemap.xml"
      - "robots.txt"
      - "scripts/public_site_qa.py"
      - "scripts/legal_publication_candidate_dry_run.py"
      - "scripts/legal_publication_full_rehearsal.py"
      - "scripts/build_unpublished_legal_cutover_preview.py"
      - "scripts/live_analytics_probe.readonly.py"
      - "scripts/live_analytics_browser_probe.readonly.py"
      - "scripts/organizations_browser_qa.py"
      - "scripts/clean_url_browser_qa.py"
      - ".github/workflows/public-site-qa.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run public HTML link, existing tool, and sitemap checks
        run: |
          python3 scripts/public_site_qa.py
          python3 scripts/legal_publication_candidate_dry_run.py
          python3 scripts/legal_publication_full_rehearsal.py
          python3 scripts/build_unpublished_legal_cutover_preview.py
          python3 scripts/live_analytics_probe.readonly.py
      - name: Save PRIVATE REVIEW-ONLY legal cutover preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: groundwork-LEGAL-CUTOVER-PREVIEW-NOT-EFFECTIVE
          path: groundwork-legal-cutover-PREVIEW-ONLY/
          if-no-files-found: error
          retention-days: 14
  browser-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install headless browser test dependencies
        run: |
          python3 -m pip install playwright
          python3 -m playwright install chromium
      - name: Verify Organizations desktop and mobile interaction
        run: |
          python3 scripts/organizations_browser_qa.py
          python3 scripts/clean_url_browser_qa.py
          python3 scripts/live_analytics_browser_probe.readonly.py
